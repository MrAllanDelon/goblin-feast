<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goblin Feast</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #050805;
    background-image:
      linear-gradient(rgba(68,232,38,.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(68,232,38,.08) 1px, transparent 1px);
    background-size: 46px 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Oswald', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
  }
  .flags {
    position: fixed;
    top: 20px;
    right: 20px;
    display: flex;
    gap: 10px;
    z-index: 5;
  }
  .flags button {
    width: 46px;
    height: 32px;
    padding: 0;
    border: 2px solid #000;
    border-radius: 6px;
    cursor: pointer;
    overflow: hidden;
    background: transparent;
  }
  .flags svg { width: 100%; height: 100%; display: block; }
  .wrap {
    text-align: center;
    padding: 24px;
    max-width: 640px;
  }
  .logo-img {
    width: min(85vw, 460px);
    height: auto;
    display: block;
    margin: 0 auto;
    filter: drop-shadow(0 6px 18px rgba(0,0,0,.6));
  }
  .rule {
    width: min(80%, 360px);
    height: 4px;
    margin: 28px auto;
    background: #f527bb;
    box-shadow: 0 0 16px 2px rgba(245,39,187,.9);
  }
  .tagline {
    font-size: clamp(20px, 4vw, 30px);
    font-weight: 600;
    letter-spacing: .04em;
    color: #fff;
    text-transform: uppercase;
  }
  .sub {
    margin-top: 14px;
    font-size: clamp(14px, 2.4vw, 17px);
    font-weight: 400;
    color: #9fdc8f;
    letter-spacing: .02em;
  }
  .patreon {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-top: 36px;
    padding: 12px 26px;
    border: 2px solid #000;
    border-radius: 999px;
    text-decoration: none;
    background: #ff424d;
    box-shadow: inset 0 3px 6px rgba(255,255,255,.35), 0 0 14px rgba(255,66,77,.6);
    font-weight: 600;
    font-size: 16px;
    color: #fff;
    letter-spacing: .02em;
  }
  .patreon svg { width: 20px; height: 20px; display: block; }
</style>
</head>

        <path d="M0,0 L60,40 M60,0 L0,40" stroke="#cf142b" stroke-width="4"/>
        <path d="M30,0 V40 M0,20 H60" stroke="#fff" stroke-width="13"/>
        <path d="M30,0 V40 M0,20 H60" stroke="#cf142b" stroke-width="6"/>
      </svg>
    </button>
    <button id="flag-pt" aria-label="Português" onclick="setLang('pt')">

        <circle cx="26" cy="15" r="1" fill="#fff"/>

        <circle cx="24" cy="24" r="1" fill="#fff"/>

      </svg>
    </button>
