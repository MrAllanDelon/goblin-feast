<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goblin Feast</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #050805;
    background-image:
      linear-gradient(rgba(68,232,38,.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(68,232,38,.08) 1px, transparent 1px);
    background-size: 46px 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Oswald', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
  }
  .wrap {
    text-align: center;
    padding: 24px;
    max-width: 640px;
  }
  .logo {
    font-family: Impact, 'Arial Narrow', sans-serif;
    font-weight: 900;
    line-height: .92;
    letter-spacing: .02em;
  }
  .logo .g {
    display: block;
    font-size: clamp(48px, 12vw, 108px);
    color: #44e826;
    text-shadow:
      -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000, 3px 3px 0 #000,
      0 0 24px rgba(68,232,38,.85);
  }
  .logo .f {
    display: block;
    font-size: clamp(48px, 12vw, 108px);
    color: #f527bb;
    text-shadow:
      -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000, 3px 3px 0 #000,
      0 0 24px rgba(245,39,187,.85);
    margin-top: 4px;
  }
  .rule {
    width: min(80%, 360px);
    height: 4px;
    margin: 28px auto;
    background: #f527bb;
    box-shadow: 0 0 16px 2px rgba(245,39,187,.9);
  }
  .tagline {
    font-size: clamp(20px, 4vw, 30px);
    font-weight: 600;
    letter-spacing: .04em;
    color: #fff;
    text-transform: uppercase;
  }
  .sub {
    margin-top: 14px;
    font-size: clamp(14px, 2.4vw, 17px);
    font-weight: 400;
    color: #9fdc8f;
    letter-spacing: .02em;
  }
  .patreon {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-top: 36px;
    padding: 12px 26px;
    border: 2px solid #000;
    border-radius: 999px;
    text-decoration: none;
    background: #ff424d;
    box-shadow: inset 0 3px 6px rgba(255,255,255,.35), 0 0 14px rgba(255,66,77,.6);
    font-weight: 600;
    font-size: 16px;
    color: #fff;
    letter-spacing: .02em;
  }
  .patreon svg { width: 20px; height: 20px; display: block; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">
      <span class="g">GOBLIN</span>
      <span class="f">FEAST</span>
    </div>
    <div class="rule"></div>
    <div class="tagline">Something's cooking...</div>
    <div class="sub">Our new game is almost ready. Stay tuned!</div>
    <a class="patreon" href="https://www.patreon.com/home" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <rect x="3" y="3" width="4.4" height="18" fill="#fff"/>
        <circle cx="15.2" cy="9.8" r="6.8" fill="#fff"/>
      </svg>
      <span>Support on Patreon</span>
    </a>
  </div>
</body>
</html>
