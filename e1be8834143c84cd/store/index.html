  body {
    background: #050805;
    background-image:
      linear-gradient(rgba(68,232,38,.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(68,232,38,.06) 1px, transparent 1px);
    background-size: 46px 46px;
    font-family: 'Oswald', -apple-system, BlinkMacSystemFont, sans-serif;
    color: #fff;
    --tox: #44e826;
    --pink: #f527bb;
    --out: -1.5px -1.5px 0 #000,1.5px -1.5px 0 #000,-1.5px 1.5px 0 #000,1.5px 1.5px 0 #000,0 3px 4px rgba(0,0,0,.55);
  }
  a { color: inherit; }
  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
    padding: 16px 24px;
    border-bottom: 4px solid var(--pink);
    box-shadow: 0 0 16px 2px rgba(245,39,187,.5);
    background: #000;
  }
  .nav .logo-link img { height: 54px; width: auto; display: block; }
  .nav-right { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .nav-links { display: flex; gap: 10px; flex-wrap: wrap; }
  .nav-links a {
    font-family: 'A Dripping Marker', cursive, Impact, sans-serif;
    font-size: 22px;
    letter-spacing: .02em;
    color: #fff;
    text-decoration: none;
    padding: 8px 20px;
    border: 2px solid #3a0f45;
    border-radius: 999px;
    background: linear-gradient(180deg,#ff5fd3 0%,#f527bb 48%,#9c0f6e 100%);
    box-shadow: inset 0 2px 4px rgba(255,255,255,.5), inset 0 -3px 6px rgba(0,0,0,.4);
  }
  .nav-links a.current {
    background: linear-gradient(180deg,#84f25a 0%,#44e826 48%,#1f8f10 100%);
    color: #052;
  }
  .flags { display: flex; gap: 8px; }
  .flags button {
    width: 40px;
    height: 28px;
    padding: 0;
    border: 2px solid #000;
    border-radius: 5px;
    cursor: pointer;
    overflow: hidden;
    background: transparent;
  }
  .flags svg { width: 100%; height: 100%; display: block; }
  main { max-width: 1000px; margin: 0 auto; padding: 48px 24px 80px; text-align: center; }
  .badge {
    display: inline-block;
    margin-top: 10px;
    padding: 8px 22px;
    border: 2px solid #000;
    border-radius: 999px;
    background: #ff424d;
    color: #fff;
    font-weight: 700;
    letter-spacing: .04em;
    font-size: 14px;
    box-shadow: 0 0 12px rgba(255,66,77,.6);
  }
  h1.page-title {
    font-family: 'A Dripping Marker', cursive, Impact, sans-serif;
    font-size: clamp(48px, 9vw, 96px);
    color: var(--tox);
    text-shadow: -3px -3px 0 #000,3px -3px 0 #000,-3px 3px 0 #000,3px 3px 0 #000, 0 0 22px rgba(68,232,38,.7);
    letter-spacing: .02em;
    line-height: 1;
    margin-top: 18px;
  }
  .subhead {
    font-family: 'A Dripping Marker', cursive, Impact, sans-serif;
    font-size: clamp(22px, 4vw, 34px);
    color: var(--pink);
    text-shadow: var(--out);
    margin-top: 8px;
  }
  .hero-img { max-width: 460px; width: 100%; height: auto; margin: 32px auto 0; display: block; filter: drop-shadow(0 10px 26px rgba(0,0,0,.6)); }
  .hero-img.wide { max-width: 640px; }
  .copy { max-width: 640px; margin: 32px auto 0; font-size: 18px; line-height: 1.6; color: #d7f5cd; }
  .gallery { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; margin-top: 32px; }
  .gallery img { max-width: 260px; width: 100%; height: auto; border-radius: 12px; border: 4px solid #000; box-shadow: 0 0 0 3px #2bd316; }
  footer {
    text-align: center;
    padding: 32px 24px 48px;
    color: #6fae5f;
    font-size: 14px;
  }
  footer a { color: var(--pink); text-decoration: underline; }
</style>

  <script>
    var NAV_STRINGS = {
      en: { game: 'The Game', soda: 'The Soda', store: 'Store' },
      pt: { game: 'O Jogo', soda: 'O Refri', store: 'Loja' }
    };
    function applyNav(lang) {
      var t = NAV_STRINGS[lang];
      var g = document.getElementById('nav-game'); if (g) g.textContent = t.game;
      var s = document.getElementById('nav-soda'); if (s) s.textContent = t.soda;
      var st = document.getElementById('nav-store'); if (st) st.textContent = t.store;
      var en = document.getElementById('flag-en'); if (en) en.style.opacity = lang === 'en' ? 1 : 0.4;
      var pt = document.getElementById('flag-pt'); if (pt) pt.style.opacity = lang === 'pt' ? 1 : 0.4;
    }
    function setLang(lang) {
      localStorage.setItem('gfLang', lang);
      applyNav(lang);
      if (typeof applyPageStrings === 'function') applyPageStrings(lang);
    }
    var initialLang = localStorage.getItem('gfLang') || 'en';
    setLang(initialLang);
  </script>
